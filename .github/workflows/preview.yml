name: Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Fork PRs get no secrets, so they cannot deploy a preview.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check preview credentials
        id: creds
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          for name in CONVEX_DEPLOY_KEY VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            {
              echo "### Preview skipped"
              echo
              echo "Missing secrets:$missing. Add them to the \`preview\` environment to enable previews."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Preview skipped::Missing secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "${CONVEX_DEPLOY_KEY%%:*}" != "preview" ]; then
            echo "::error::CONVEX_DEPLOY_KEY in the preview environment must be a Preview Deploy Key (preview:...), never a production key"
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.creds.outputs.ready == 'true'
        run: npm ci

      - if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@65.16.0 pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Guard against a hard-coded Convex URL in the Vercel project
        if: steps.creds.outputs.ready == 'true'
        # Same reason as deploy.yml: a project-level VITE_CONVEX_URL could override the preview backend.
        run: |
          if grep -qs '^VITE_CONVEX_URL=' .vercel/.env.preview.local; then
            echo "::error::VITE_CONVEX_URL is set in the Vercel project's Preview environment; remove it so the build uses the Convex preview URL"
            exit 1
          fi

      - name: Deploy Convex preview and build against it
        if: steps.creds.outputs.ready == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        # --preview-name reuses one Convex deployment per PR (--preview-create would recreate it on every push
        # and burn the team's deployment limit). Previews expire on their own.
        run: >-
          npx convex deploy
          --preview-name "$PREVIEW_NAME"
          --cmd 'npx vercel@65.16.0 build --token="$VERCEL_TOKEN"'
          --cmd-url-env-var-name VITE_CONVEX_URL

      - name: Deploy Vercel preview
        id: vercel
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(npx vercel@65.16.0 deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: steps.creds.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.vercel.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="Preview: ${PREVIEW_URL} (commit ${SHA:0:7}, own Convex backend, expires on its own)"
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "$body"
